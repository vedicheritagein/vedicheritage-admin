<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      No indexing, no referrers, no caching.
      This page is a door to the donor list: it must never be crawled, and a
      shared or logged referrer must not carry the URL onward.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />

    <!--
      The organisation's seal, the same files the public site serves, so the
      dashboard is recognisably the same body rather than a generic tab.

      Two raster sizes rather than one scaled down: the seal is dense line-work
      with lettering around the rim, and a browser downscaling 32 to 16 turns
      that rim into mud. PNG rather than the WEBP the pages use, because this
      is the one asset a browser fetches before it runs anything, and every
      browser and pinned-tab surface can already decode PNG.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Fundraiser Dashboard – Vedic Heritage Inc.</title>
    <meta name="theme-color" content="#4A0D12" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
